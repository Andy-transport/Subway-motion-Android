name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android platform (generated, never committed)
        run: bash tools/scaffold_android.sh

      - name: Prepare web assets from Subway-motion
        run: bash tools/prepare_web.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Subway-tools-Android-1.0.0A
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
