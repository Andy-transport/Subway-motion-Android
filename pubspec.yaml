name: subway_tools
description: >-
  Subway tools for Android - 12-city metro map, route planning, station
  search and timetables. Flutter shell reusing the Subway-motion web core.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  # Round-3 white-screen differential test: the official WebView side
  # by side with flutter_inappwebview (see lib/main.dart). Kept only if
  # it wins on the user's devices.
  webview_flutter: ^4.10.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  device_info_plus: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
