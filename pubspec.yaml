name: subway_tools
description: >-
  Subway tools for Android - 12-city metro map, route planning, station
  search and timetables. Flutter shell reusing the Subway-motion web core.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  # The official WebView. flutter_inappwebview was removed on
  # 2026-11-22: its platform view never attached on the user's
  # devices (onWebViewCreated never fired under any composition mode
  # or renderer), while webview_flutter worked in the same build.
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0
  # Backs the WebView file selector (profile avatar picking). Without
  # a selector callback, webview_flutter silently swallows <input
  # type=file> taps - the login page's avatar picker did nothing on
  # device (2026-11-22).
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  device_info_plus: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/maps/
